[project]
name = "cartoon3d-engine"
version = "0.2.0"
description = "Engine sinh video hoạt hình 3D dựng bằng code trong roster của video engine: nhận chunk_input, trả render_output đúng thời lượng."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cartoon3d = "core.pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["core", "core.shot_planner", "core.camera_library", "core.sensitivity", "core.look_adapter", "core.qa_gates",
            "backends", "backends.threejs", "backends.blender"]
