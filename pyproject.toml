[project]
name = "cartoon3d-engine"
version = "0.1.0"
description = "Engine sinh video hoạt hình 3D dựng bằng code cho video engine: nhận chunk có timeline SRT, trả video đúng thời lượng."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cartoon3d = "core.pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: cần node + playwright + Chromium + ffmpeg"]

[tool.setuptools]
packages = ["core", "core.shot_planner", "core.camera_library", "core.sensitivity", "core.captions", "core.qa_gates",
            "backends", "backends.threejs", "backends.blender"]
